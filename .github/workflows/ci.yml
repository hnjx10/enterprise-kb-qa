name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests benchmarks
      - name: Ruff format
        run: ruff format --check src tests benchmarks
      - name: Mypy
        run: mypy src

  test:
    name: 测试（${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q

  eval:
    # 检索指标每次提交重算一遍。这不是「跑个测试」——改写分块、分词、融合任何一处，
    # 数字都会动；不钉在 CI 上，等发现召回变差时已经找不到是哪次改动引入的。
    name: 检索评测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: 建索引并自检
        run: |
          python -m kbqa.cli ingest
          python -m kbqa.cli doctor
        env:
          PYTHONPATH: src
      - name: 评测（K=5）
        run: python -m kbqa.cli eval --k 5
        env:
          PYTHONPATH: src

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t enterprise-kb-qa:ci .
